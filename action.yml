name: 'OpenShift Login'
description: 'Log into an OpenShift cluster and set up a Kubernetes context'
author: 'Red Hat'
branding:
  icon: circle
  color: red
inputs:
  ##### Inputs for login
  openshift_server_url:
    description: 'OpenShift Server URL. Required unless a kubeconfig with a server already exists on the runner.'
    required: false
  ### Authenticating
  openshift_token:
    description: 'OpenShift Bearer Token. Store in a secret.'
    required: false
  openshift_username:
    description: 'OpenShift Username. Must be used with openshift_password.'
    required: false
  openshift_password:
    description: 'OpenShift Password. Store in a secret. Must be used with openshift_username.'
    required: false
  use_oidc:
    description: |
      Authenticate using GitHub's OIDC token instead of a long-lived token or password.
      Requires the OpenShift cluster's API server to be configured with GitHub as an OIDC provider.
      The workflow must have 'permissions: id-token: write'.
      When enabled, openshift_server_url is required and openshift_token/username/password are ignored.
    required: false
    default: 'false'
  oidc_audience:
    description: |
      The audience claim for the GitHub OIDC token.
      Defaults to openshift_server_url if not set. Must match the audience configured on the cluster.
    required: false
  ### TLS Cert options
  insecure_skip_tls_verify:
    description: 'Skip TLS certificate verification when connecting to the cluster.'
    required: false
    default: 'false'
  certificate_authority_data:
    description: "Contents of a Certificate Authority (.crt) file for your cluster's SSL certificate. Store in a secret."
    required: false
  ##### Inputs for kubeconfig
  namespace:
    description: "Set current context's namespace to this, after logging in."
    required: false
  ##### Other inputs
  logout:
    description: |
      Log out of the cluster and remove the kubeconfig at the end of the job.
      Recommended for self-hosted runners. Set to false to keep the session open.
    required: false
    default: "true"
  reveal_cluster_name:
    description: |
      "By default, the cluster name is masked, since it can be used to derive the server URL.
      Set this to true to skip masking the cluster name."
    required: false
    default: "false"


runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/index.js'
